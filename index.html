<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandprix Platform Demo v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --demo-bg:#111; --demo-fg:#eee;
  --rl-bg:#ffffff; --rl-fg:#111; --rl-mute:#6f6d6e; --rl-line:#e6e8eb; --rl-soft:#f4f5f7; --rl-acc:#111;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0b0b0d;color:#fff;font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit}
img{max-width:100%;display:block}
.hide{display:none!important}

/* ---------- demo bar ---------- */
.demobar{position:sticky;top:0;z-index:60;background:#000;border-bottom:1px solid #222;display:flex;align-items:center;gap:8px;padding:6px 14px;font:500 12px/1.2 'IBM Plex Sans Thai',sans-serif;color:#bbb;overflow-x:auto;white-space:nowrap}
.demobar b{color:#fff;letter-spacing:.04em}
.demobar .tag{background:#2a2a2a;color:#d4f53c;border-radius:99px;padding:3px 8px;font-weight:600}
.demobar a{padding:5px 10px;border-radius:99px;border:1px solid #2a2a2a}
.demobar a.on{background:#fff;color:#000;border-color:#fff}
.demobar .sp{flex:1}
.demobar .who{color:#8ef0c4}
.demobar button{border:1px solid #333;border-radius:99px;padding:5px 10px;color:#bbb}

/* ---------- account chip (shared) ---------- */
.gpa-chip{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600;line-height:1}
.gpa-chip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.gpa-chip small{display:block;font-size:10px;font-weight:500;opacity:.7;margin-top:2px}
.gpa-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;border-radius:12px;padding:8px;z-index:30;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.gpa-menu a,.gpa-menu button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:13px}
.gpa-menu .hdr{padding:8px 10px 10px;font-size:12px;opacity:.75;border-bottom:1px solid rgba(128,128,128,.25);margin-bottom:6px}
.rel{position:relative}

/* ---------- TDE ---------- */
.tde{min-height:100vh;background:#050507;color:#fff;font-family:'IBM Plex Sans Thai',Prompt,system-ui,sans-serif;position:relative;overflow:hidden}
.tde:before{content:"";position:absolute;inset:0;background:radial-gradient(700px 400px at 90% 30%,rgba(76,120,255,.18),transparent 60%),radial-gradient(600px 380px at 75% 70%,rgba(255,200,0,.10),transparent 60%),radial-gradient(500px 300px at 10% 90%,rgba(255,60,160,.10),transparent 60%);pointer-events:none}
.tde-nav{position:relative;z-index:2;background:rgba(8,7,11,.65);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
.tde-nav .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
.tde-nav .logo{display:flex;align-items:center;gap:12px}
.tde-nav .logo img{height:26px}
.tde-nav .logo .sub{font-size:11px;letter-spacing:.2em;color:#aaa;border-left:1px solid #333;padding-left:12px}
.tde-nav .links{display:flex;gap:4px;margin-left:12px}
.tde-nav .links a{padding:8px 12px;border-radius:99px;font-size:13px;color:#ccc}
.tde-nav .links a.on,.tde-nav .links a:hover{color:#fff;background:rgba(255,255,255,.06)}
.tde-nav .sp{flex:1}
.tde-btn{border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px}
.tde-btn.y{background:#ffe600;color:#0a0a0a}
.tde-btn.o{border:1.5px solid rgba(255,255,255,.28)}
.tde .gpa-chip{border:1.5px solid rgba(255,255,255,.28)}
.tde .gpa-chip .av{background:#ffe600;color:#000}
.tde .gpa-menu{background:#121216;border:1px solid #2a2a30}
.tde .gpa-menu a:hover,.tde .gpa-menu button:hover{background:#1d1d22}
.tde-main{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:28px 20px 80px}
.tde-step{display:flex;align-items:center;gap:12px;font-size:16px;letter-spacing:.08em}
.tde-step .n{background:#ffe600;color:#000;border-radius:6px;padding:2px 10px;font-weight:700;font-size:13px}
.tde-step .r{margin-left:auto;font-size:11px;color:#888;letter-spacing:.2em}
.tde-bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 26px}
.tde-bars i{height:4px;border-radius:2px;background:#2a2a30}
.tde-bars i.on{background:#ffe600}
.tde-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.tde-hero img.big{border-radius:14px;width:100%;aspect-ratio:2.6/1;object-fit:cover}
.tde-hero .ribbon{display:inline-block;background:#ffe600;color:#000;font-weight:600;padding:4px 10px;transform:rotate(-2deg);margin:10px 0 12px}
.tde-hero p{color:#bbb;margin:4px 0}
.tde-passes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}
.tde-pass{border:1px solid #26262c;background:linear-gradient(180deg,#121216,#0c0c10);border-radius:16px;padding:22px;position:relative}
.tde-pass.pr{border-color:rgba(255,230,0,.45);box-shadow:0 0 0 1px rgba(255,230,0,.15) inset}
.tde-pass .k{font-size:11px;letter-spacing:.2em;color:#ffe600}
.tde-pass h3{margin:8px 0 6px;font-size:24px}
.tde-pass ul{margin:12px 0 18px;padding-left:18px;color:#bbb;font-size:14px;line-height:1.8}
.tde-pass .price{font-size:13px;color:#888}
.tde-merch{margin-top:34px;border:1px dashed rgba(255,230,0,.35);border-radius:16px;padding:20px;display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:center}
.tde-merch h4{margin:0 0 6px;font-size:18px}
.tde-merch p{margin:0;color:#aaa;font-size:14px}
.mini-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mini{border-radius:12px;overflow:hidden;font-size:12px}
.mini img{aspect-ratio:1/1;object-fit:cover;width:100%;background:#fff}
.mini div{padding:8px}
.mini b{display:block;font-size:13px;margin-top:2px}
.tde .mini{background:#121216;border:1px solid #26262c}

/* ---------- Souped Up ---------- */
.su{min-height:100vh;color:#f4f6f9;font-family:'Rajdhani','Noto Sans Thai',system-ui,sans-serif;background:linear-gradient(rgba(10,11,13,.55),rgba(10,11,13,.8)),url(assets/bgImg-1280.webp) center/cover fixed #0a0b0d;position:relative}
.su:before{content:"";position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -200px,rgba(225,6,0,.10),transparent 60%),radial-gradient(900px 520px at 0% 100%,rgba(111,255,232,.07),transparent 60%),radial-gradient(900px 520px at 100% 100%,rgba(209,255,3,.06),transparent 60%);pointer-events:none}
.su-nav{position:relative;z-index:2;background:rgba(10,11,13,.9);border-bottom:1px solid #2a2f3a}
.su-nav .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.su-nav img{height:34px}
.su-nav .links{display:flex;gap:2px;margin-left:10px}
.su-nav .links a{padding:8px 12px;font-weight:600;font-size:15px;color:#98a0af;border-radius:8px;letter-spacing:.02em}
.su-nav .links a.on,.su-nav .links a:hover{color:#f4f6f9;background:#15181e}
.su-nav .sp{flex:1}
.su-lang{display:inline-flex;border:1px solid #2a2f3a;border-radius:99px;overflow:hidden;font-size:12px;font-weight:700}
.su-lang span{padding:4px 10px;color:#98a0af}
.su-lang span.on{background:linear-gradient(115deg,#6FFFE8,#9dffb0 48%,#D1FF03);color:#0a0b0d}
.su .gpa-chip{color:#f4f6f9}
.su .gpa-chip .av{background:linear-gradient(115deg,#6FFFE8,#D1FF03);color:#0a0b0d}
.su .gpa-menu{background:#15181e;border:1px solid #2a2f3a;font-family:'Noto Sans Thai',sans-serif}
.su .gpa-menu a:hover,.su .gpa-menu button:hover{background:#1b1f27}
.su-main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:32px 16px 90px}
.su-card{background:linear-gradient(180deg,#15181e,#111318);border:1px solid #2a2f3a;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden}
.su-card .speed{height:2px;background:linear-gradient(90deg,#6FFFE8,#D1FF03,transparent)}
.su-card .pad{padding:24px}
.su h1{font-size:30px;margin:0 0 4px;font-weight:700;letter-spacing:.01em}
.su .sub{color:#98a0af;font-family:'Noto Sans Thai',sans-serif;font-size:14px;margin:0 0 20px}
.su-choose{display:grid;gap:14px}
.su-choose a{display:block;border-radius:12px;overflow:hidden;border:1px solid #2a2f3a;transition:.15s}
.su-choose a:hover{border-color:#6FFFE8;transform:translateY(-2px)}
.su-choose .cap{padding:12px 16px;background:#1b1f27;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px}
.su-choose .cap small{font-family:'Noto Sans Thai',sans-serif;font-weight:400;color:#98a0af;font-size:13px}
.su-merch{margin-top:22px}
.su-merch .h{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}
.su-merch h3{margin:0;font-size:20px}
.su .mini{background:#1b1f27;border:1px solid #2a2f3a;font-family:'Noto Sans Thai',sans-serif}
.su-btn{display:inline-block;background:linear-gradient(115deg,#6FFFE8 0%,#9dffb0 48%,#D1FF03 100%);color:#0a0b0d;font-weight:700;border-radius:10px;padding:10px 18px;font-size:15px;box-shadow:0 4px 14px rgba(111,255,232,.35)}
.su-foot{text-align:center;color:#6b7280;font-size:12px;padding:20px;position:relative;z-index:2}


/* ---------- Runbike ---------- */
.rb{min-height:100vh;background:#f5f6f8;color:#0f172a;font-family:Prompt,system-ui,sans-serif}
.rb-nav{background:#001529;color:#fff}
.rb-nav .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}
.rb-nav img{height:30px}
.rb-nav .links{display:flex;gap:4px;margin-left:12px}
.rb-nav .links a{padding:8px 12px;font-size:14px;border-radius:10px;color:#cbd5e1}
.rb-nav .links a.on,.rb-nav .links a:hover{background:rgba(255,255,255,.08);color:#fff}
.rb-nav .sp{flex:1}
.rb-lang{display:inline-flex;border:1px solid #334155;border-radius:10px;overflow:hidden;font-size:13px}
.rb-lang span{padding:5px 10px}
.rb-lang span+span{border-left:1px solid #334155}
.rb .gpa-chip{background:rgba(255,255,255,.08)}
.rb .gpa-chip .av{background:#ff4d4f;color:#fff}
.rb .gpa-menu{background:#fff;color:#0f172a;border:1px solid #e2e8f0}
.rb .gpa-menu a:hover,.rb .gpa-menu button:hover{background:#f1f5f9}
.rb-main{max-width:1180px;margin:0 auto;padding:22px 20px 90px}
.rb-hero{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e2e8f0}
.rb-grid{display:grid;grid-template-columns:260px 1fr;gap:22px;margin-top:22px}
.rb-side{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px;align-self:start}
.rb-side a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:14px;color:#334155}
.rb-side a.on{background:#fef2f2;color:#dc2626;font-weight:600}
.rb-side hr{border:0;border-top:1px solid #e2e8f0;margin:8px 4px}
.rb-panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px}
.rb-panel h2{margin:0;font-size:22px}
.rb-panel .sub{color:#64748b;font-size:14px;margin:4px 0 16px}
.rb-seg{display:inline-flex;background:#f1f5f9;border-radius:10px;padding:3px;margin-bottom:16px}
.rb-seg span{padding:7px 16px;border-radius:8px;font-size:14px;color:#64748b}
.rb-seg span.on{background:#fff;color:#0f172a;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rb-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#dc2626,#b91c1c);color:#fff;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;box-shadow:0 6px 16px rgba(220,38,38,.25)}
.rb-btn.ghost{background:#fff;color:#dc2626;border:1px solid #fecaca;box-shadow:none}
.rb-reg{border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;margin-top:12px}
.rb-reg .top{background:#001529;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;font-size:14px}
.rb-reg .rows{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;font-size:13px}
.rb-reg .rows span{display:block;color:#64748b;font-size:12px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.paid{background:#dcfce7;color:#15803d}
.pill.pending{background:#fef3c7;color:#b45309}
.rb .mini{background:#fff;border:1px solid #e2e8f0}
.rb-merch{margin-top:22px}
.rb-merch .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

/* ---------- Grandprix Account (IdP) ---------- */
.gpa{min-height:100vh;display:grid;place-items:center;padding:30px 16px;background:#0e0f12;color:#f4f6f9;font-family:'IBM Plex Sans Thai',sans-serif;position:relative}
.gpa:before{content:"";position:absolute;inset:0;background:radial-gradient(700px 400px at 20% 0%,var(--gpa-acc-soft,rgba(111,255,232,.12)),transparent 60%),radial-gradient(700px 400px at 100% 100%,rgba(255,255,255,.04),transparent 60%);pointer-events:none}
.gpa-box{position:relative;width:100%;max-width:440px;background:#15171c;border:1px solid #2a2d35;border-radius:18px;padding:28px}
.gpa-brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.16em;font-size:13px}
.gpa-brand .dot{width:26px;height:26px;border-radius:8px;background:var(--gpa-acc,#6FFFE8);display:grid;place-items:center;color:#000;font-size:13px;letter-spacing:0}
.gpa-from{margin:18px 0 6px;display:flex;align-items:center;gap:10px;background:#1c1f26;border-radius:12px;padding:10px 12px;font-size:13px;color:#aab}
.gpa-from img{height:22px}
.gpa h2{margin:14px 0 4px;font-size:22px}
.gpa .muted{color:#98a0af;font-size:13px}
.gpa-tabs{display:grid;grid-template-columns:1fr 1fr;background:#0e0f12;border-radius:12px;padding:4px;margin:18px 0}
.gpa-tabs button{padding:9px;border-radius:9px;font-weight:600;color:#98a0af;font-size:14px}
.gpa-tabs button.on{background:var(--gpa-acc,#6FFFE8);color:#0a0b0d}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:#98a0af;margin-bottom:6px;letter-spacing:.04em}
.fld input,.fld select{width:100%;background:#0e0f12;border:1px solid #2a2d35;border-radius:10px;padding:11px 12px;color:#f4f6f9;outline:none}
.fld input:focus{border-color:var(--gpa-acc,#6FFFE8)}
.row2{display:grid;grid-template-columns:110px 1fr;gap:8px}
.gpa-submit{width:100%;padding:12px;border-radius:11px;background:var(--gpa-acc,#6FFFE8);color:#0a0b0d;font-weight:700;margin-top:6px}
.gpa-line{width:100%;padding:12px;border-radius:11px;background:#06C755;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;font-size:15px}
.gpa-line:hover{background:#05b14c}
.gpa-line .ic{width:22px;height:22px;border-radius:6px;background:#fff;color:#06C755;display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:-.04em}
.gpa-or{display:flex;align-items:center;gap:10px;margin:16px 0;color:#6b7280;font-size:12px}
.gpa-or:before,.gpa-or:after{content:"";flex:1;height:1px;background:#2a2d35}
.gpa-consent{background:#0e0f12;border:1px solid #2a2d35;border-radius:14px;padding:16px;margin-top:16px}
.gpa-consent .hd{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid #2a2d35;margin-bottom:12px}
.gpa-consent .av{width:40px;height:40px;border-radius:50%;background:#06C755;display:grid;place-items:center;font-weight:800;color:#fff}
.gpa-consent ul{margin:0;padding-left:18px;font-size:13px;color:#aab;line-height:1.9}
.gpa-consent .warn{background:#1c1f26;border-radius:10px;padding:10px 12px;font-size:12px;color:#fbbf24;margin-top:12px;line-height:1.6}
.line-badge{display:inline-flex;align-items:center;gap:5px;background:#06C755;color:#fff!important;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700}
.gpa-note{margin-top:16px;padding:12px;border-radius:12px;background:#1c1f26;font-size:12px;color:#aab;line-height:1.6}
.gpa-sites{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.gpa-sites span{background:#0e0f12;border:1px solid #2a2d35;border-radius:99px;padding:3px 10px;font-size:11px}
.otp{display:flex;gap:8px;justify-content:center;margin:14px 0}
.otp input{width:44px;height:50px;text-align:center;font-size:20px;background:#0e0f12;border:1px solid #2a2d35;border-radius:10px;color:#fff}

/* ---------- rodlifestore (Option A) ---------- */
.rl{min-height:100vh;background:var(--rl-bg);color:var(--rl-fg);font-family:'IBM Plex Sans Thai',sans-serif}
.rl-top{background:#111;color:#ddd;font-size:12px;text-align:center;padding:7px}
.rl-nav{border-bottom:1px solid var(--rl-line);background:#fff;position:sticky;top:31px;z-index:20}
.rl-nav .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:14px 20px}
.rl-logo{font-weight:800;font-size:22px;letter-spacing:-.02em}
.rl-logo span{font-weight:400;color:var(--rl-mute)}
.rl-search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--rl-soft);border-radius:99px;padding:9px 14px;color:var(--rl-mute);font-size:14px}
.rl-search input{border:0;background:none;outline:none;flex:1}
.rl-nav .sp{flex:1}
.rl-cart{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rl-line);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:600}
.rl-cart i{font-style:normal;background:#111;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.rl .gpa-chip{border:1px solid var(--rl-line)}
.rl .gpa-chip .av{background:#111;color:#fff}
.rl .gpa-menu{background:#fff;border:1px solid var(--rl-line);color:#111}
.rl .gpa-menu a:hover,.rl .gpa-menu button:hover{background:var(--rl-soft)}
.rl-main{max-width:1180px;margin:0 auto;padding:20px 20px 90px}
.rl-banner{border-radius:18px;background:#111;color:#fff;padding:34px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;overflow:hidden;position:relative}
.rl-banner h1{margin:0 0 8px;font-size:34px;line-height:1.15}
.rl-banner p{color:#bbb;margin:0 0 16px}
.rl-banner .imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rl-banner .imgs img{border-radius:12px;aspect-ratio:1/1;object-fit:cover;background:#fff}
.rl-btn{display:inline-block;background:#111;color:#fff;border-radius:99px;padding:10px 20px;font-weight:600;font-size:14px}
.rl-btn.w{background:#fff;color:#111}
.rl-btn.line{background:#fff;color:#111;border:1px solid #111}
.rl-btn[disabled]{opacity:.4;cursor:not-allowed}
.rl-proj{display:flex;gap:10px;margin:24px 0 16px;flex-wrap:wrap}
.rl-proj button{border:1px solid var(--rl-line);border-radius:99px;padding:8px 16px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.rl-proj button.on{background:#111;color:#fff;border-color:#111}
.rl-proj button .d{width:10px;height:10px;border-radius:50%}
.rl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.rl-card{cursor:pointer}
.rl-card .im{border-radius:14px;overflow:hidden;background:var(--rl-soft);aspect-ratio:1/1;position:relative}
.rl-card .im img{width:100%;height:100%;object-fit:cover;transition:.25s}
.rl-card:hover .im img{transform:scale(1.04)}
.rl-card .ev{position:absolute;left:10px;top:10px;font-size:11px;font-weight:600;border-radius:99px;padding:3px 9px;color:#fff}

/* ---------- event summary (ค่าสมัคร/บัตร + add-on marketplace) ---------- */
.beam{background:#fff;color:#111}
.sum-grid{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
.sum-box{border-radius:16px;padding:20px;margin-bottom:16px;background:rgba(255,255,255,.05);border:1px solid rgba(148,163,184,.28)}

.addon{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.addon .it{border:1px solid rgba(148,163,184,.3);border-radius:12px;overflow:hidden;font-size:12px}

.sum-tot{position:sticky;top:110px}

.sum-tot .row.t{font-size:19px;font-weight:700;border-top:1px solid rgba(148,163,184,.35);margin-top:8px;padding-top:12px}
.sum-pay{display:block;width:100%;text-align:center;padding:13px;border-radius:12px;font-weight:700;margin-top:12px}
.evsim{display:flex;gap:8px;align-items:center;font-size:12px;opacity:.85;margin-bottom:16px;flex-wrap:wrap}
.evsim button{border:1px solid rgba(148,163,184,.45);border-radius:99px;padding:4px 12px;font-size:12px}
.evsim button.on{background:#ef4444;color:#fff;border-color:#ef4444}

.closed-box a.rl-btn{background:#fff;color:#111}
.rb .closed-box a.rl-btn{background:#111;color:#fff}
.closed-box button.rl-btn,.closed-box a.rl-btn.line{background:transparent;color:inherit;border:1px solid currentColor}
@media(max-width:900px){.sum-grid{grid-template-columns:1fr}.addon{grid-template-columns:repeat(2,1fr)}.sum-tot{position:static}}

.pd2 .gal{display:flex;gap:12px}

.pd2 .main{flex:1;aspect-ratio:1;border-radius:20px;background:#F4F5F7;position:relative;overflow:hidden}

.pd2 .main .tg{position:absolute;top:14px;left:14px;display:flex;gap:4px}.pd2 .main .tg i{font-style:normal;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px}
.pd2 .info{display:flex;flex-direction:column;gap:16px;position:sticky;top:150px}
.pd2 h1{font-size:30px;font-weight:700;line-height:1.3;margin:0}.pd2 .sku{font-size:13px;color:#6F6D6E;margin-top:4px}
.pd2 .prc{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.pd2 .prc b{font-size:30px}

.pd2 hr{border:0;border-top:1px solid #E6E8EB;margin:0}
.pd2 .lr{display:flex;justify-content:space-between;font-size:14px}.pd2 .lr a{color:#6F6D6E;text-decoration:underline}
.pd2 .sz{display:grid;gap:8px}

.pd2 .qr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px}
.qty2{display:inline-flex;align-items:center;border:1px solid #E6E8EB;border-radius:999px;font-size:16px}
.qty2 button{padding:9px 16px;font-size:16px}.qty2 b{min-width:24px;text-align:center}
.qty2.sm button{padding:4px 12px;font-size:15px}.qty2.sm b{font-size:14px;min-width:18px}
.pd2 .bt{display:flex;gap:10px}
.pd2 .bt button{flex:1;font-weight:700;font-size:15px;border-radius:999px;padding:15px;white-space:nowrap}
.pd2 .pri{background:#111;color:#fff}.pd2 .sec{background:#fff;border:1.5px solid #111!important;padding:14px!important}
.pd2 .ask{align-self:flex-start;border:1px solid #E6E8EB;border-radius:999px;padding:8px 14px;font-size:13px}
.pd2 .perks{border:1px solid #E6E8EB;border-radius:16px;overflow:hidden;font-size:14px}
.pd2 .perks>div{display:flex;gap:12px;padding:14px 16px}.pd2 .perks>div+div{border-top:1px solid #E6E8EB}.pd2 .perks small{font-size:12px;color:#6F6D6E;display:block}

.pay2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;max-width:880px;margin:0 auto}

@media (max-width:860px){

function lineStart(){gpaStep='line';render()}
function lineApprove(isNew,from,to){
  window._line={name:'Thanapol GP',email:'thanapol@example.com',uid:'U8f2c1a...'};
  if(isNew){gpaStep='lineinfo';render();return}
  // เคสนี้: LINE userId นี้เคยผูกกับบัญชีเดิมแล้ว → เข้าได้เลย ไม่ต้องกรอกอะไร
  S.lineLinked=true; finishLogin(from,false,to); toast('เข้าสู่ระบบด้วย LINE — บัญชีนี้เคยผูกไว้แล้ว ไม่ต้องกรอกข้อมูลซ้ำ');
}
function lineFinish(from,to){
  window._reg={name:window._line.name,email:$('#le').value||window._line.email,mobile:'+66 '+($('#lm').value||'812 345 678')};
  S.lineLinked=true; finishLogin(from,true,to); toast('สมัครด้วย LINE สำเร็จ · เพิ่ม @grandprix เป็นเพื่อนแล้ว — ตั๋วและ QR จะส่งเข้า LINE');
}
function startOtp(){window._reg={name:$('#rn').value||'Somchai Rattanachai',mobile:'+66 '+($('#rm').value||'812 345 678'),email:$('#re').value||'somchai@example.com'};gpaStep='otp';render()}
function dest(from,to){if(to) return decodeURIComponent(to);return from==='store'?'#/store':from==='admin'?'#/admin':from==='me'?'#/me':'#/'+from}
function finishLogin(from,isNew,to){
  const names={tde:'TDE','souped-up':'Souped Up',runbike:'Runbike',store:'ร้านค้ากรังด์ปรีซ์',admin:'Back-office',me:'บัญชีของฉัน'};
  S.user = isNew ? {id:'C-'+(20000+Math.floor(Math.random()*900)),...window._reg,isNew:true}
                 : {id:'C-10021',name:'ธนพล ตัวอย่าง',email:'thanapol@example.com',mobile:'+66 81 234 5601'};
  if(S.lineLinked){S.user.line=true;S.user.lineName=(window._line&&window._line.name)||S.user.name;S.user.lineUid=(window._line&&window._line.uid)||'U8f2c1a...';S.lineLinked=false}
  gpaStep='form';
  S.loginFrom=from;S.loginFromName=names[from];S.loginCount++;
  gpaStep='form';save();
  toast('เข้าสู่ระบบสำเร็จ — กำลังกลับไป '+(names[from]||'หน้าเดิม'));
  go(dest(from,to));
}

function qrCells(seed){
  const fp=(x,y)=>{for(const [ox,oy] of [[0,0],[14,0],[0,14]]){const dx=x-ox,dy=y-oy;if(dx>=0&&dx<7&&dy>=0&&dy<7)return (dx===0||dx===6||dy===0||dy===6)||(dx>=2&&dx<=4&&dy>=2&&dy<=4)?1:0}return -1};
  let c='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=fp(x,y);if(f>=0?f===1:vHash(seed+x+'q'+y)%2===0)c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return c;
}

}

function modalAdd(){
  const p=P(MODAL.id);
  if(p.opt&&!mSel.opt){toast('เลือก'+(p.optName||'ไซส์')+'ก่อน');return}
  const room=stockRoom(MODAL.id,MODAL.target==='addon'?addonList(MODAL.ev):S.cart);
  if(room<mSel.qty){toast(room?'เพิ่มได้อีก '+room+' ชิ้น (สต็อกเหลือ '+p.stock+')':'สินค้าหมด / อยู่ในรายการครบสต็อกแล้ว');return}
  if(MODAL.target==='addon'){
    const arr=S.addon[MODAL.ev]=S.addon[MODAL.ev]||[];
    const ex=arr.find(x=>x.id===MODAL.id&&x.opt===mSel.opt);
    if(ex) ex.qty+=mSel.qty; else arr.push({id:MODAL.id,opt:mSel.opt||null,qty:mSel.qty});
    save();toast('เพิ่มของที่ระลึกในรายการแล้ว');
  } else {
    const ex=S.cart.find(c=>c.id===MODAL.id&&c.opt===mSel.opt);
    if(ex) ex.qty+=mSel.qty; else S.cart.push({id:MODAL.id,opt:mSel.opt||null,qty:mSel.qty,ev:MODAL.ev});
    save();toastLink('เพิ่ม '+p.name+(mSel.opt?' ('+mSel.opt+')':'')+' ลงตะกร้าแล้ว','ดูตะกร้า','#/store/cart');
  }
  MODAL=null;render();
}
function cfgAddVal(){const i=$('#cfgv');const v=(i.value||'').trim();if(!v)return;if(!cfg.vals.includes(v))cfg.vals.push(v);i.value='';renderModal();$('#cfgv')&&$('#cfgv').focus()}
function cfgDel(v){cfg.vals=cfg.vals.filter(x=>x!==v);renderModal()}
function cfgSave(){
  const id=MODAL.id;
  if(cfg.on&&!cfg.vals.length){toast('ใส่ตัวเลือกอย่างน้อย 1 ค่า');return}
  const patch=cfg.on?{opt:[...cfg.vals],optName:cfg.name||'ไซส์'}:{opt:null,optName:null};

        ${cfg.on?`

function mkAdd(id,ev){
  const p=P(id); if(!p) return;
  if(p.opt){openOpt(id,ev,'cart');return}
  if(!stockRoom(id,S.cart)){toast(p.stock?'อยู่ในตะกร้าครบสต็อกแล้ว ('+p.stock+' ชิ้น)':'สินค้าหมด');return}
  const ex=S.cart.find(c=>c.id===id&&!c.opt); if(ex) ex.qty++; else S.cart.push({id,opt:null,qty:1,ev});
  save();render();toastLink('เพิ่ม '+p.name+' ลงตะกร้าแล้ว','ดูตะกร้า','#/store/cart');
}

function totals(){

  if(coupon&&CODES[coupon]&&CODES[coupon].active===false){msg='โค้ดนี้ถูกปิดใช้งานแล้ว'}
  else if(coupon){const c=CODES[coupon];const base=S.cart.filter(x=>P(x.id).ev.includes(c.ev)).reduce((a,x)=>a+P(x.id).price*x.qty,0);
    if(!base){msg='โค้ดนี้ใช้ได้กับสินค้า '+EVENTS[c.ev].short+' เท่านั้น'}
    else if(c.min&&base<c.min){msg='ยอดสินค้า '+EVENTS[c.ev].short+' ขั้นต่ำ '+fmt(c.min)}
    else disc=c.type==='pct'?Math.round(base*c.v/100):Math.min(c.v,base);}
  const shipFee=cartShip()==='pickup'||sub-disc>=1500||!sub?0:60;
  return {sub,disc,msg,shipFee,total:sub-disc+shipFee};
}
/* รับหน้างานได้เมื่อทุกบรรทัดเป็นงานเดียวกัน (R16.6) — ตะกร้าหลายงานบังคับจัดส่ง */
function cartEvs(){return [...new Set(S.cart.map(c=>c.ev))]}

/* กระจายส่วนลดลงเฉพาะบรรทัดที่เข้าเงื่อนไขโค้ด (largest remainder · Σ = ส่วนลด) — R16.10 */
function allocDisc(lines,code,disc){
  const c=CODES[code];const elig=lines.map((l,i)=>({i,v:l.kind==='merch'&&(!c||(P(l.id)&&P(l.id).ev.includes(c.ev)))?l.price*l.qty:0})).filter(x=>x.v>0);
  const base=elig.reduce((a,x)=>a+x.v,0);const out=lines.map(()=>0);if(!disc||!base) return out;
  elig.forEach(x=>{out[x.i]=Math.floor(disc*x.v/base)});let rest=disc-out.reduce((a,b)=>a+b,0);
  [...elig].sort((a,b)=>(disc*b.v/base%1)-(disc*a.v/base%1)).forEach(x=>{if(rest>0){out[x.i]++;rest--}});
  return out;
}

const SPON_SHARE=.20;   // ส่วนแบ่งแพลตฟอร์มจากรายได้สปอนเซอร์ (Plus) — อัตรายังเป็นร่าง
const MERCH_TIERS=[[0,250000,.05],[250000,500000,.04],[500000,Infinity,.03]];   // คิดตั้งแต่บาทแรก · ขั้นบันได (แต่ละขั้นคิดเฉพาะยอดในขั้น)
const tierLbl=(f,to)=>{const a=(f?f+1:0).toLocaleString('en-US');return to===Infinity?a+' ขึ้นไป':a+' – '+to.toLocaleString('en-US')};
const fmtC=v=>v>0&&v<100&&v%1?'฿'+v.toFixed(2):fmt(Math.round(v));
function merchFee(m){return Math.round(MERCH_TIERS.reduce((a,[f,t,r])=>a+Math.max(0,Math.min(m,t)-f)*r,0))}
function tAvg(t){return t.txn?Math.round(t.gmv/t.txn):0}
function tSpon(t){if(tTier(t)!=='Plus')return 0;return t.id==='gpi'?(typeof spons==='function'?spons().reduce((a,x)=>a+sponEarn(x),0)*12:0):(t.spon||0)}   // รายได้สปอนเซอร์ต่อปี (ของ tenant)
function tBill(t){const crm=yBill(t).fee,gp=merchFee(tMerch(t)),sp=Math.round(tSpon(t)*SPON_SHARE);return {crm,gp,sp,total:crm+gp+sp}}

function tierOpts(){return ['ทั่วไป','เงิน','ทอง','แพลทินัม']}   // ระดับสมาชิกตายตัว 4 ระดับ · ทีมตั้งเองรายคน (ถอดช่องข้อมูลที่ตั้งเองออกแล้ว 2026-10-07)
function personTier(id){const v=(veS().data[id]||{}).tier??TIER_SEED[id];const o=tierOpts();return o.includes(v)?v:o[0]}
const TIER_SEED={'C-10021':'แพลทินัม','C-10022':'ทอง','C-10024':'ทอง'};   // ทีม GP ตั้งไว้เอง (ตัวอย่าง) · คนอื่นเริ่มที่ระดับแรก
/* ============================================================
   v2 · SEGMENT BUILDER
   ============================================================ */
/* ฐานลูกค้า = คนที่มีรายการจริงอย่างน้อย 1 งาน (ผู้ใช้ demo ที่ login แต่ยังไม่ซื้อไม่นับ) — ใช้ทั้ง dashboard / segment / แคมเปญ */
function custBase(){return customers().filter(c=>Object.keys(c.ev).length>0)}
function segDefs(){
  const cs=custBase();
  const nev=c=>Object.keys(c.ev).length;
  const sp=(c,t)=>spend(c,'',t);
  return [
    {k:'old',n:'ลูกค้าเก่า',d:'เคยร่วมงานใดก็ได้ → เปิด pre-sale ให้ซื้อก่อน',f:c=>nev(c)>0},
    {k:'multi',n:'แฟนหลายงาน',d:'มาตั้งแต่ 2 งานขึ้นไป → เชิญเป็นสมาชิก VIP',f:c=>nev(c)>=2},
    {k:'ticket',n:'เคยซื้อบัตร / ตั๋ว',d:'ไม่รวมคนที่ซื้อแต่ของที่ระลึก → ชวนงานปีหน้า',f:c=>sp(c,'ticket')>0},
    {k:'reg',n:'เคยจ่ายค่าสมัครแข่ง',d:'กลุ่มนักแข่ง → ชวนสนามถัดไป',f:c=>sp(c,'reg')>0},
    {k:'buyer',n:'ซื้อของเยอะ',d:'ยอดซื้อสินค้า ≥ ฿1,000 → ให้สิทธิ์ซื้อ limited ก่อน',f:c=>sp(c,'merch')>=1000},
    {k:'cross',n:'ยังไม่เคยซื้อสินค้า',d:'มาแล้วแต่ไม่เคยซื้อของ → โอกาส cross-sell',f:c=>sp(c,'all')>0&&sp(c,'merch')===0},
    {k:'unpaid',n:'ค้างจ่าย',d:'สมัครแล้วยังไม่จ่าย → ตามอัตโนมัติ 1 ชม. / 24 ชม.',sim:1,f:c=>(c.id.charCodeAt(c.id.length-1))%7===0},
    {k:'noshow',n:'ไม่มางาน (no-show)',d:'ซื้อตั๋วแล้วแต่ไม่ check-in → ถามเหตุผล เสนองานถัดไป',sim:1,f:c=>(c.id.charCodeAt(c.id.length-1))%5===0},
  ].map(x=>({...x,c:cs.filter(x.f).length,tot:cs.length}));
}
let bld={ev:'',type:'all',min:0,multi:'',name:''};
function bldCount(){return bldMatch().length}
/* เงื่อนไขของ segment builder — เก็บเงื่อนไขไว้กับกลุ่ม แล้วคำนวณสมาชิกสดทุกครั้ง */
function matchCond(q,c){
  if(q.ev&&!c.ev[q.ev]) return false;
  if(q.multi==='y'&&Object.keys(c.ev).length<2) return false;
  if(q.multi==='y3'&&Object.keys(c.ev).length<3) return false;
  const v=spend(c,q.ev||'',q.type||'all');
  return v>0&&v>=Number(q.min||0);   // ต้องเคยมีรายการประเภทนั้นจริง (ยอด > 0) และถึงขั้นต่ำ
}
function bldMatch(){return custBase().filter(c=>matchCond(bld,c))}
function bldPreview(){const m=bldMatch();return m.slice(0,5).map(c=>`<span class="bld-p"><i>${esc(c.name.slice(0,1))}</i>${esc(c.name)}</span>`).join('')+(m.length>5?`<span class="bld-p more">+${m.length-5}</span>`:'')}
function setBld(k,v){bld[k]=v;render()}
function saveSeg(){
  const n=bldCount();
  const name=(bld.name||'').trim()||`กลุ่มที่สร้างเอง · ${bld.ev?evShort(bld.ev):'ทุกงาน'} · ${KIND[bld.type]||'ทุกประเภท'}${bld.min>0?' · ใช้จ่าย ≥ '+fmt(bld.min):''}${bld.multi==='y'?' · แฟนหลายงาน':''}`;
  S.segs=[...(S.segs||[]),{name,n,cond:{ev:bld.ev,type:bld.type,min:Number(bld.min||0),multi:bld.multi}}];save();render();
  toast('บันทึกกลุ่ม "'+name+'" ('+n+' คน) — ใช้ยิงแคมเปญได้แล้ว');
}
let segView='list';
function segAll(){
  const D=segDefs();
  const cs=custBase();
  const custom=(S.segs||[]).map((g,i)=>{const f=g.cond?(c=>matchCond(g.cond,c)):(()=>false);   // กลุ่มเก่าที่ไม่มีเงื่อนไข → 0 คน (ให้สร้างใหม่)
    return {k:'c'+i,n:g.name,d:g.cond?'สร้างเองจาก segment builder':'บันทึกจากเวอร์ชันก่อน (ไม่มีเงื่อนไข) — สร้างใหม่เพื่อใช้ยิงแคมเปญ',f,c:cs.filter(f).length,tot:D[0].tot,custom:1}});

const PCAT=['รถโมเดล / ของสะสม','เสื้อผ้า','ของที่ระลึก','เครื่องดื่ม / ของใช้'];
function pcat(p){
  const o=S.prod[p.id]; if(o&&o.cat) return o.cat;
  const n=p.name;
  if(/โมเดล|Boxset|Majorette|SPECIAL EDITION/i.test(n)) return PCAT[0];
  if(/เสื้อ|หมวก|แจ็คเก็ต|กระเป๋า/i.test(n)) return PCAT[1];
  if(/พวงกุญแจ|เบาะ|แลนยาร์ด|สติกเกอร์/i.test(n)) return PCAT[2];
  return PCAT[3];
}

  if(k==='type'&&val==='kanban'&&!v.kb){const f=vO().f.find(f=>f.t==='select');v.kb=f&&f.k}
  if(k==='type'&&val==='calendar'&&!v.cal){const f=vO().f.find(f=>f.t==='date');v.cal=f&&f.k}
  vClosePop();render()}
function vSort(k){const v=vMut();v.dir=(v.sort===k&&v.dir==='asc')?'desc':'asc';v.sort=k;render()}
function vSave(){const L=veS().views[vObj],i=L.findIndex(x=>x.id===vDraft.id);L[i]=vDraft;vDraft=null;save();render();toast('บันทึกมุมมองแล้ว')}
function vSaveAs(){const n=prompt('ชื่อมุมมองใหม่','สำเนาของ '+vDraft.name);if(!n)return;
  const v={...vDraft,id:'v'+Date.now(),name:n};veS().views[vObj].push(v);veS().cur[vObj]=v.id;vDraft=null;save();render();toast('สร้างมุมมอง "'+n+'" แล้ว')}

  const v={id:'v'+Date.now(),name:n,type:'table',cols:o.f.slice(0,5).map(f=>f.k),filters:[],logic:'and',group:'',sort:o.f[0].k,dir:'asc'};

/* แก้ในตารางได้เฉพาะค่าที่ทีมตั้งเอง — ยอด / จำนวนงาน / ชนิด ฯลฯ คำนวณจาก order จริง (แก้ไม่ได้)
   สถานะ order → setOrdSt (ผ่านตาราง transition) · สถานะจัดส่ง → setShipSt (sync order) · ขนส่ง/เลขพัสดุ → S.ship */
const V_EDIT={person:['tier','consent'],order:['status'],shipment:['dstat','carrier','trk']};
function vEditable(k){return (V_EDIT[vObj]||[]).includes(k)}
function vWrite(id,k,v){
  if(vObj==='order'&&k==='status'){setOrdSt(id,v);render();return}
  if(vObj==='shipment'&&k==='dstat'){const s0=shipments().find(x=>x.id===id);if(!s0){render();return}
    if(DSTAT.indexOf(v)<DSTAT.indexOf(s0.dstat)){toast('ย้อนสถานะพัสดุไม่ได้');render();return}
    if(v!==s0.dstat){setShipSt(id,v);toast(id+' → '+v+' · แจ้งลูกค้าทาง LINE อัตโนมัติ')}save();render();return}
  if(vObj==='shipment'){setShip(id,k,v);return}
  veS().data[id]={...(veS().data[id]||{}),[k]:v};save();render()}
function vEdit(td,id,k){
  if(td.querySelector('select,input')) return;   // กำลังแก้อยู่ — คลิกที่ dropdown เองไม่ต้องสร้างใหม่ (เดิมทำให้กระพริบ)
  const F=vFld(k); if(!F||['multi','avatar','code'].includes(F.t)||!vEditable(k)) return;
  const base=vO().rows.find(x=>x.id===id); if(!base) return;
  const cur=vObj==='person'?((veS().data[id]&&veS().data[id][k])??base[k]):base[k];
  let el;
  if(F.t==='select'||F.t==='bool'){
    el=document.createElement('select');
    const opts=F.t==='bool'?[['true','รับ'],['false','ไม่รับ']]:F.o.map(o=>[o,o]);
    opts.forEach(([v,t])=>{const op=document.createElement('option');op.value=v;op.textContent=t;el.appendChild(op)});
    el.value=F.t==='bool'?String(!!cur):cur;
  } else {
    el=document.createElement('input');
    el.type=(F.t==='money'||F.t==='num')?'number':(F.t==='date'?'date':'text');
    el.value=cur;
  }
  el.onclick=e=>e.stopPropagation();el.onmousedown=e=>e.stopPropagation();
  td.innerHTML='';td.appendChild(el);el.focus();
  if(el.tagName==='SELECT'){try{el.showPicker()}catch(e){}}
  let fired=0;
  const done=()=>{if(fired++)return;let v=el.value;if(F.t==='money'||F.t==='num')v=+v;if(F.t==='bool')v=(v==='true');
    if(v===cur){render();return}vWrite(id,k,v)};
  el.onblur=done; el.onkeydown=e=>{if(e.key==='Enter')el.blur();if(e.key==='Escape'){fired=1;render()}};
  if(F.t==='select'||F.t==='bool')el.onchange=done;
}
let vDragId=null;
function vDragStart(e,id){vDragId=id;e.target.classList.add('drag');e.dataTransfer.effectAllowed='move'}
function vDrop(e,key,val){e.preventDefault();document.querySelectorAll('.kcol').forEach(c=>c.classList.remove('over'));
  if(!vDragId)return;const id=vDragId;vDragId=null;
  if(!vEditable(key)){toast('ฟิลด์นี้คำนวณจากระบบ — ย้ายไม่ได้');render();return}
  const cur=(vO().rows.find(x=>x.id===id)||{})[key];if(cur===val) return;
  if(vObj==='person'){vWrite(id,key,val);toast('ย้าย '+id+' → '+val);return}
  vWrite(id,key,val)}
function vSelAll(on){vRows().forEach(x=>vSel[x.id]=on);render()}
function vBulk(a){toast(a+' · '+Object.values(vSel).filter(Boolean).length+' รายการ (ตัวอย่าง)')}
function vOpen(id){vDrawer=id;render()}
function vClosePop(){vPopOpen=null;const e=$('#vpop');if(e)e.innerHTML=''}
function vOps(k){const F=vFld(k);
  if(!F)return [['=','เท่ากับ']];
  if(F.t==='money'||F.t==='num')return [['=','เท่ากับ'],['>=','มากกว่าเท่ากับ'],['<=','น้อยกว่าเท่ากับ']];
  if(F.t==='multi')return [['has','มี'],['nothas','ไม่มี']];
  if(F.t==='bool')return [['=','เป็น']];
  if(F.t==='select')return [['=','เท่ากับ'],['!=','ไม่เท่ากับ']];
  return [['contains','มีคำว่า'],['=','เท่ากับ']];
}
function vValInput(f,i){const F=vFld(f.f);
  if(!F) return '';
  if(F.t==='bool')return `<select onchange="vSetF(${i},'v',this.value)"><option value="true" ${f.v==='true'?'selected':''}>รับ</option><option value="false" ${f.v==='false'?'selected':''}>ไม่รับ</option></select>`;
  if(F.t==='select'||F.t==='multi'){const o=F.o||VEV;return `<select onchange="vSetF(${i},'v',this.value)">${o.map(x=>`<option ${f.v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
  return `<input style="width:86px" value="${esc(f.v)}" oninput="vSetF(${i},'v',this.value,1)">`;
}
function vFilterBtn(){return [...document.querySelectorAll('.ve .tbtn')].find(b=>b.textContent.includes('ฟิลเตอร์'))}
function vColBtn(){return [...document.querySelectorAll('.ve .tbtn')].find(b=>b.textContent.includes('คอลัมน์'))}
function vPop(kind,btn){
  if(vPopOpen===kind){vClosePop();return}
  vPopOpen=kind; const v=vView(), r=btn.getBoundingClientRect(); let h='';
  if(kind==='filter'){
    h=`<h4>เงื่อนไข</h4>${v.filters.map((f,i)=>`<div class="row">
      ${i===0?'<span class="lgc">เมื่อ</span>':`<select onchange="vMut().logic=this.value;render();vPop('filter',vFilterBtn())"><option value="and" ${v.logic==='and'?'selected':''}>และ</option><option value="or" ${v.logic==='or'?'selected':''}>หรือ</option></select>`}
      <select onchange="vSetF(${i},'f',this.value)">${vO().f.map(x=>`<option value="${x.k}" ${f.f===x.k?'selected':''}>${x.l}</option>`).join('')}</select>
      <select onchange="vSetF(${i},'op',this.value)">${vOps(f.f).map(o=>`<option value="${o[0]}" ${f.op===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
      ${vValInput(f,i)}<button class="x" onclick="vDelF(${i})">✕</button></div>`).join('')}
      <button class="addf" onclick="vAddF()">+ เพิ่มเงื่อนไข</button>
      <div class="hint">เงื่อนไขผูกกับ <b>มุมมอง</b> ไม่ใช่กับหน้าจอ — เปลี่ยนแล้วกดบันทึกเพื่อให้ทีมเห็นเหมือนกัน</div>`;
  }
  if(kind==='group'){
    h=`<h4>จัดกลุ่มตาม</h4><div class="row"><select style="width:100%" onchange="vSet('group',this.value)">
      <option value="">ไม่จัดกลุ่ม</option>${vO().f.filter(f=>['select','bool','num'].includes(f.t)).map(f=>`<option value="${f.k}" ${v.group===f.k?'selected':''}>${f.l}</option>`).join('')}</select></div>
      <div class="hint">จัดกลุ่มแล้วจะมีแถวหัวกลุ่มพร้อมยอดรวมให้อัตโนมัติ</div>`;
  }
  if(kind==='sort'){
    h=`<h4>เรียงตาม</h4><div class="row"><select onchange="vMut().sort=this.value;render()">${vO().f.map(f=>`<option value="${f.k}" ${v.sort===f.k?'selected':''}>${f.l}</option>`).join('')}</select>
      <select onchange="vMut().dir=this.value;render()"><option value="asc" ${v.dir==='asc'?'selected':''}>น้อย → มาก</option><option value="desc" ${v.dir==='desc'?'selected':''}>มาก → น้อย</option></select></div>
      <div class="hint">กดหัวคอลัมน์ในตารางก็เรียงได้เหมือนกัน</div>`;
  }
  if(kind==='cols'){
    h=`<h4>คอลัมน์ที่แสดง</h4>${vO().f.map(f=>`<label class="ck"><input type="checkbox" ${v.cols.includes(f.k)?'checked':''} onchange="vTglCol('${f.k}')"> ${f.l}</label>`).join('')}
      <div class="hint">ผู้ใช้เลือกเองได้ว่าจะเห็นฟิลด์ไหนการนี้อัตโนมัติ</div>`;
  }
  const el=$('#vpop'); if(el) el.innerHTML=`<div class="pop" style="left:${Math.min(r.left,window.innerWidth-380)}px;top:${r.bottom+6}px">${h}</div>`;
}
function vSetF(i,k,val,quiet){const v=vMut();v.filters[i][k]=val;
  if(k==='f'){v.filters[i].op=vOps(val)[0][0];const F=vFld(val);v.filters[i].v=F.t==='bool'?'true':(F.o?F.o[0]:'')}
  render(); if(!quiet)vPop('filter',vFilterBtn());}
function vAddF(){const v=vMut(),f=vO().f[0];v.filters.push({f:f.k,op:vOps(f.k)[0][0],v:f.o?f.o[0]:''});render();vPop('filter',vFilterBtn())}
function vDelF(i){const v=vMut();v.filters.splice(i,1);render();vPop('filter',vFilterBtn())}
function vTglCol(k){const v=vMut();const i=v.cols.indexOf(k);i<0?v.cols.push(k):v.cols.splice(i,1);render();vPopOpen=null;vPop('cols',vColBtn())}
document.addEventListener('click',e=>{if(vPopOpen&&!e.target.closest('.pop')&&!e.target.closest('.tbtn'))vClosePop()});

const EMO={'⋮⋮':'grip-vertical','🇹🇭':'globe','🇯🇵':'globe','🇸🇬':'globe','→':'arrow-right','➜':'arrow-right','✓':'check','✕':'x','←':'arrow-left','‹':'chevron-left','📦':'package','🛍':'shopping-bag','💬':'message-circle','🚚':'truck','🎫':'ticket','🧾':'receipt','🏁':'flag','⬇':'download','⬆':'upload','📍':'map-pin','🎯':'target','📊':'chart-column','👥':'users','🔍':'search','👤':'user','🏠':'house','🔒':'lock','🔐':'lock-keyhole','🔥':'flame','🔁':'repeat','🏆':'trophy','🧩':'puzzle','🖨':'printer','⚠':'triangle-alert','↓':'arrow-down','↑':'arrow-up','↕':'arrow-up-down','↔':'arrow-left-right','↗':'arrow-up-right','↺':'rotate-ccw','📣':'megaphone','🏷':'tag','📅':'calendar','✉':'mail','⚙':'settings','⚡':'zap','🔔':'bell','🛒':'shopping-cart','💳':'credit-card','☰':'menu','⭐':'star','📝':'file-text','📎':'paperclip','👋':'hand','🔑':'key','👪':'users-round','🎉':'party-popper','📱':'smartphone','⌘':'command','🔗':'link','🎪':'tent','☑':'square-check','◉':'circle-dot','🧭':'compass','🚫':'ban','🖼':'image','🙏':'hand-heart','⌨':'keyboard','⏳':'hourglass','⏰':'alarm-clock','▾':'chevron-down','▴':'chevron-up','▦':'layout-grid','▤':'rows-3','▥':'columns-3','▧':'calendar-days'};
const EMO_RE=new RegExp('('+'⋮⋮|🇹🇭|🇯🇵|🇸🇬|→|➜|✓|✕|←|‹|📦|🛍|💬|🚚|🎫|🧾|🏁|⬇|⬆|📍|🎯|📊|👥|🔍|👤|🏠|🔒|🔐|🔥|🔁|🏆|🧩|🖨|⚠|↓|↑|↕|↔|↗|↺|📣|🏷|📅|✉|⚙|⚡|🔔|🛒|💳|☰|⭐|📝|📎|👋|🔑|👪|🎉|📱|⌘|🔗|🎪|☑|◉|🧭|🚫|🖼|🙏|⌨|⏳|⏰|▾|▴|▦|▤|▥|▧'+')[\uFE0E\uFE0F]?','gu');
const EMO_STRIP=t=>t.replace(EMO_RE,'').replace(/^\s+/,'');
function iconize(root){
  if(!root||root.nodeType===3&&root.parentNode&&root.parentNode.closest&&root.parentNode.closest('svg')) return;
  const el=root.nodeType===1?root:root.parentNode; if(!el) return;
  const SKIP=/^(OPTION|TEXTAREA|SCRIPT|STYLE|TITLE|svg|path)$/;
  if(root.nodeType===3){fixText(root);return}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{EMO_RE.lastIndex=0;return EMO_RE.test(n.data)?1:3}});
  const list=[];while(w.nextNode())list.push(w.currentNode);
  list.forEach(fixText);
  root.querySelectorAll&&root.querySelectorAll('[title],[placeholder],[aria-label],option').forEach(e=>{
    ['title','placeholder','aria-label'].forEach(a=>{const v=e.getAttribute(a);if(v){EMO_RE.lastIndex=0;if(EMO_RE.test(v))e.setAttribute(a,EMO_STRIP(v))}});
    if(e.tagName==='OPTION'){EMO_RE.lastIndex=0;if(EMO_RE.test(e.textContent))e.textContent=EMO_STRIP(e.textContent)}});
  function fixText(n){
    const p=n.parentNode;if(!p||SKIP.test(p.nodeName)||(p.closest&&p.closest('svg')))return;
    EMO_RE.lastIndex=0;if(!EMO_RE.test(n.data))return;
    const span=document.createElement('span');span.style.display='contents';
    span.innerHTML=esc(n.data).replace(EMO_RE,(m,g)=>ic(EMO[g]));
    p.replaceChild(span,n);
  }
}
new MutationObserver(ms=>ms.forEach(m=>{m.addedNodes.forEach(n=>iconize(n));if(m.type==='characterData')iconize(m.target)})).observe(document.body,{childList:true,subtree:true,characterData:true});

function render(){
  const {path,q}=parse();
  let html='', bar='#/';
  if(path==='/'||path==='/guide'){html=pageLauncher();bar='#/'}
  else if(path==='/me'){html=pageMe();bar='#/me'}
  else if(path==='/account'){html=pageAccount(q);bar=''}
  else if(path==='/tde'){html=pageTDE();bar='#/tde'}
  else if(path==='/souped-up'){html=pageSU();bar='#/souped-up'}
  else if(path==='/runbike'){html=pageRB();bar='#/runbike'}
  else if(path==='/summary'){html=pageSummary(q);bar='#/'+((EVENTS[q.event]||EVENTS.SOUPED_UP).route)}
  else if(path==='/store'){html=pageStore(q);bar='#/store'}
  else if(path.startsWith('/store/p/')){html=pageProduct(path.split('/')[3],q);bar='#/store'}
  else if(path==='/store/cart'){html=pageCart();bar='#/store'}
  else if(path==='/store/pay'){html=pagePay();bar='#/store'}
  else if(path==='/store/done'){html=pageDone(q);bar='#/store'}
  else if(path==='/store/orders'){html=pageOrders();bar='#/store'}
  else if(path==='/admin'){html=pageAdminDash();bar='#/admin'}
  else if(path==='/admin/customers'){custMode=q.f==='top'?'top':'list';html=pageAdminViews({obj:'person'});bar='#/admin'}
  else if(path==='/admin/top-spender'||path==='/admin/top'){html=pageAdminCust();bar='#/admin'}
  else if(path==='/admin/products'){prodTab='list';html=pageAdminProducts();bar='#/admin'}
  else if(path==='/admin/promos'){html=pageAdminPromos();bar='#/admin'}
  else if(path==='/admin/orders'){html=pageAdminOrders();bar='#/admin'}
  else if(path==='/admin/segments'){html=pageAdminSegments();bar='#/admin'}
  else if(path==='/admin/campaigns'){html=pageAdminCampaigns();bar='#/admin'}
  else if(path==='/admin/billing'){html=pageAdminBilling();bar='#/admin'}
  else if(path==='/admin/views'){if(q.obj==='person')custMode='list';html=pageAdminViews(q);bar='#/admin'}
  else if(path==='/admin/inventory'){prodTab='stock';html=pageAdminInventory();bar='#/admin'}
  else if(path==='/admin/delivery'){html=pageAdminDelivery();bar='#/admin'}
  else if(path==='/admin/events'||path==='/admin/fields'){html=pageAdminDash();bar='#/admin'}   // ถอดออกแล้ว (ตั้งค่างาน · ช่องข้อมูลที่ตั้งเอง)
  else if(path==='/admin/edm'){campView='list';html=pageAdminCampaigns();bar='#/admin'}   // EDM รวมเข้าแคมเปญแล้ว
  else if(path==='/admin/sponsor'){html=pageAdminSponsor();bar='#/admin'}
  else if(path.startsWith('/go/')){html=pageSponGo(path.split('/')[2]);bar='#/store'}
  else if(path==='/admin/chat'){html=pageAdminChat();bar='#/admin'}
  else if(path==='/line'){html=pageLine(q);bar='#/line'}
  else if(NO_PF&&path.startsWith('/platform')){location.hash='#/';return}
  else if(path==='/platform'){html=pagePlatform();bar='#/platform'}
  else if(path.startsWith('/platform/t/')){html=pageTenant(path.split('/')[3]);bar='#/platform'}
  else html=pageLauncher();
  demoBar(bar);
  const focusId=document.activeElement&&document.activeElement.id;
  $('#app').innerHTML=html;
  if(focusId==='ain'){const i=$('#ain');i&&i.focus()}
  const am=$('#amsgs'); if(am) am.scrollTop=am.scrollHeight;
  const lb=$('#lnbody'); if(lb) lb.scrollTop=lb.scrollHeight;
  if(S.user&&S.ssoShown!==path.split('/')[1]){setTimeout(()=>{S.ssoShown=path.split('/')[1];},3000)}
  renderModal();
  renderChat();
}
